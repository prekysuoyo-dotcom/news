<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Bayelsa - Glory FM 97.1</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    :root { --red: #bb1919; --dark: #1a1a1a; --wa: #25D366; --gray: #f4f4f4; }
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--gray); color: #333; }
    .header { background: #fff; border-bottom: 4px solid var(--red); position: sticky; top: 0; z-index: 1000; }
    .top-bar { max-width: 1200px; margin: auto; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
    .top-bar h2 { color: var(--red); margin: 0; cursor: pointer; text-transform: uppercase; font-weight: 900; }
    .cat-nav { background: var(--dark); display: flex; overflow-x: auto; scrollbar-width: none; }
    .cat-nav button { background: none; border: none; color: #aaa; padding: 15px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
    .cat-nav button.active { color: #fff; background: var(--red); }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; display: flex; flex-direction: column; gap: 20px; }
    @media(min-width: 992px) { .container { flex-direction: row; } }
    .main-feed { flex: 3; }
    .sidebar { flex: 1; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
    .card img { width: 100%; height: 180px; object-fit: cover; }
    .card-info { padding: 12px; }
    .stats { font-size: 11px; color: #888; display: flex; gap: 10px; margin-top: 5px; }
    #reader { display: none; position: fixed; inset: 0; background: #fff; z-index: 2000; overflow-y: auto; padding: 20px; }
    .reader-box { max-width: 800px; margin: auto; }
    .story-img { width: 100%; border-radius: 8px; margin: 15px 0; }
    .story-body { font-size: 19px; line-height: 1.8; white-space: pre-line; }
    .wa-btn { background: var(--wa); color: white; padding: 12px 20px; border-radius: 4px; text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; }
    #loader { text-align: center; padding: 100px; font-weight: bold; }
  </style>
</head>
<body onload="init()">

<div id="loader"><i class="fa fa-spinner fa-spin fa-3x"></i><br><p>Loading Glory FM News...</p></div>

<div id="hub" style="display:none;">
  <div class="header">
    <div class="top-bar"><h2 onclick="location.reload()">GLORY FM</h2></div>
    <div class="cat-nav">
      <button class="active" onclick="setCat('All', this)">All News</button>
      <button onclick="setCat('Bayelsa', this)">Bayelsa</button>
      <button onclick="setCat('National', this)">National</button>
      <button onclick="setCat('Sports', this)">Sports</button>
    </div>
  </div>
  <div class="container">
    <div class="main-feed"><div id="newsGrid" class="grid"></div></div>
    <div class="sidebar">
       <div style="background:#fff; padding:15px; border-radius:8px; border-top:3px solid var(--red)">
         <h3>TRENDING</h3>
         <div id="trendingList"></div>
       </div>
    </div>
  </div>
</div>

<div id="reader">
  <div class="reader-box">
    <button onclick="closeReader()" style="margin-bottom:20px; padding:10px;">← BACK</button>
    <div id="readerContent"></div>
    <div style="margin:20px 0;">
      <a id="waShare" href="#" target="_blank" class="wa-btn"><i class="fab fa-whatsapp"></i> SHARE ON WHATSAPP</a>
    </div>
    <hr>
    <h3>RELATED STORIES</h3>
    <div id="relatedGrid" class="grid"></div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUSPUDklGraGgf01_Jdg0faPv_87-_HsshVOT9KtNfpXYRbGnrWiGolSaMIb87uf1l/exec";
  let ALL = [], filtered = [], currentStory = null;

  function init() {
    const script = document.createElement('script');
    script.src = `${SCRIPT_URL}?format=json&callback=setupNews`;
    document.body.appendChild(script);
  }

  window.setupNews = function(data) {
    ALL = data;
    filtered = [...ALL];
    document.getElementById('loader').style.display = 'none';
    document.getElementById('hub').style.display = 'block';

    const urlParams = new URLSearchParams(window.location.search);
    const storySlug = urlParams.get('story');
    if(storySlug) openStory(storySlug);
    else { render(); renderTrending(); }
  };

  function render() {
    document.getElementById('newsGrid').innerHTML = filtered.map(item => cardHtml(item)).join('');
  }

  function cardHtml(item) {
    return `<div class="card" onclick="openStory('${item.slug}')">
      <img src="${item.image || 'https://www.radiobayelsa.info/logo.png'}">
      <div class="card-info">
        <small style="color:var(--red); font-weight:bold;">${item.category}</small>
        <h3>${item.caption}</h3>
        <div class="stats"><span><i class="fa fa-eye"></i> ${item.views}</span><span><i class="fa fa-calendar"></i> ${item.date}</span></div>
      </div>
    </div>`;
  }

  function renderTrending() {
    const sorted = [...ALL].sort((a,b) => b.views - a.views).slice(0, 5);
    document.getElementById('trendingList').innerHTML = sorted.map(s => `
      <div style="display:flex; gap:10px; margin-bottom:10px; cursor:pointer;" onclick="openStory('${s.slug}')">
        <img src="${s.image}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
        <h4 style="font-size:12px; margin:0;">${s.caption}</h4>
      </div>`).join('');
  }

  function openStory(slug) {
    const s = ALL.find(x => x.slug === slug);
    if(!s) return;
    currentStory = s;
    document.getElementById('hub').style.display = 'none';
    document.getElementById('reader').style.display = 'block';
    window.scrollTo(0,0);

    const shareUrl = window.location.origin + window.location.pathname + "?story=" + s.slug;
    document.getElementById('waShare').href = `https://api.whatsapp.com/send?text=*${encodeURIComponent(s.caption)}*%0A%0ARead more: ${shareUrl}`;

    document.getElementById('readerContent').innerHTML = `
      <h1>${s.caption}</h1>
      <p>${s.date} | Reporter: ${s.reporter}</p>
      <img src="${s.image}" class="story-img">
      <div class="story-body">${s.body}</div>
    `;

    const related = ALL.filter(x => x.category === s.category && x.slug !== s.slug).slice(0, 6);
    document.getElementById('relatedGrid').innerHTML = related.map(item => cardHtml(item)).join('');
    
    fetch(`${SCRIPT_URL}?action=view&row=${s.row}`); // Log view
    window.history.pushState({}, '', "?story=" + s.slug);
  }

  function closeReader() {
    document.getElementById('reader').style.display = 'none';
    document.getElementById('hub').style.display = 'block';
    window.history.pushState({}, '', window.location.pathname);
    render();
  }

  function setCat(cat, btn) {
    document.querySelectorAll('.cat-nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filtered = cat === 'All' ? ALL : ALL.filter(x => x.category === cat);
    render();
  }
</script>
</body>
</html>
